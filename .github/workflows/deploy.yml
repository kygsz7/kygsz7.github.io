name: Siteyi yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages'e yazma izni
permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek deploy; siradaki beklesin (yarim kalan yayin olmasin)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx next build

      # Yayindan once kritik dosyalar gercekten uretilmis mi?
      # CNAME kaybolursa alan adi duser, .nojekyll kaybolursa
      # _next/ klasoru Jekyll tarafindan yoksayilir ve site stilsiz acilir.
      - name: Kritik dosyalari dogrula
        run: |
          for f in CNAME .nojekyll app-ads.txt index.html privacy.html privacy_policy.html; do
            if [ ! -f "out/$f" ]; then
              echo "HATA: out/$f uretilmedi — yayin durduruldu"
              exit 1
            fi
            echo "ok: out/$f"
          done
          grep -q "antalya-cebinde.live" out/CNAME || { echo "HATA: CNAME icerigi yanlis"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
